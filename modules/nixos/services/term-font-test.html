<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>term font test</title>
<style>
@font-face{font-family:"FiraCode Nerd Font Mono";src:url(FiraCodeNerdFontMono-Regular.ttf) format("truetype")}
@font-face{font-family:"Noto Sans Symbols 2";src:url(NotoSansSymbols2-Regular.otf) format("opentype")}
body{font:14px sans-serif;margin:16px;background:#fff;color:#000}
.s{font-size:28px}
canvas{border:1px solid #999;display:block;margin:4px 0}
pre{white-space:pre-wrap;font-size:12px}
</style>
</head>
<body>
<p>A. DOM, Noto only: <span class="s" style="font-family:'Noto Sans Symbols 2'">⏵⏵ ⏺ ✻</span></p>
<p>B. DOM, ttyd font list: <span class="s" style="font-family:'FiraCode Nerd Font Mono', 'Symbols Nerd Font Mono', 'Noto Sans Symbols 2', monospace">⏵⏵ ⏺ ✻ abc</span></p>
<p>C. canvas, ttyd list, drawn immediately:</p><canvas id="c1" width="300" height="40"></canvas>
<p>D. canvas, ttyd list, drawn after fonts load:</p><canvas id="c2" width="300" height="40"></canvas>
<p>E. canvas, Noto only, after load:</p><canvas id="c3" width="300" height="40"></canvas>
<pre id="log"></pre>
<script>
const L = (s) => (document.getElementById("log").textContent += s + "\n");
const list = "'FiraCode Nerd Font Mono', 'Symbols Nerd Font Mono', 'Noto Sans Symbols 2', monospace";
const draw = (id, fam) => {
  const x = document.getElementById(id).getContext("2d");
  x.clearRect(0, 0, 300, 40);
  x.font = "28px " + fam;
  x.fillText("⏵⏵ ⏺ ✻ abc", 4, 30);
};
L(navigator.userAgent);
draw("c1", list);
Promise.all([
  document.fonts.load('14px "FiraCode Nerd Font Mono"'),
  document.fonts.load('14px "Noto Sans Symbols 2"'),
]).then(
  (r) => L("load ok: " + r.map((a) => a.length + " face(s)").join(", ")),
  (e) => L("load FAILED: " + e),
).then(() => {
  draw("c2", list);
  draw("c3", "'Noto Sans Symbols 2'");
  for (const f of document.fonts) L(f.family + " -> " + f.status);
  L("check noto ⏵: " + document.fonts.check('14px "Noto Sans Symbols 2"', "⏵"));
});
</script>
</body>
</html>
